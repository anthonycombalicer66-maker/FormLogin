<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up</title>
  <link rel="stylesheet" href="form.css">
</head>
<body>
  <form id="signup-form" novalidate>
    <h1>Create account</h1>
    <p class="intro">Make sure to complete the details below.</p>

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username">
      <small class="error" id="username-error"></small>
    </div>

    <div class="field">
      <label for="fullname">Full name</label>
      <input type="text" id="fullname" name="fullname" autocomplete="name">
      <small class="error" id="fullname-error"></small>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email">
      <small class="error" id="email-error"></small>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password">
      <small class="error" id="password-error"></small>
    </div>

    <div class="field">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" autocomplete="new-password">
      <small class="error" id="confirm-error"></small>
    </div>

    <button type="submit">Create account</button>
    <p class="success" id="success" hidden>Account created successfully.</p>
  </form>

<script src="func.js"></script>
</body>
</html>
